# Blocks new credentials from landing in this repo.
#
# Scans only the commits a PR (or push) adds, so findings already in history do
# not fail every build; they are tracked in YMS-527 instead. Rules live in
# .gitleaks.toml (gitleaks defaults + DB URLs with passwords + credential env
# fallbacks such as a literal after `process.env.X_PASSWORD ||`).
#
# False positive? Add `// gitleaks:allow` at the end of that line, or a
# fingerprint line to .gitleaksignore, and say why in the PR.
name: secret-scan

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="${PUSH_AFTER}~1..${PUSH_AFTER}"
          fi
          echo "Scanning commits in ${range}"
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="${range}" \
            --redact \
            --no-banner \
            --exit-code 1
